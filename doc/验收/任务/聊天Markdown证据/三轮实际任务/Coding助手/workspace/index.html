<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#e0f0ff; }
</style>
</head>
<body>
<svg width="600" height="420" viewBox="0 0 600 420" xmlns="http://www.w3.org/2000/svg">
  <!-- 天空 -->
  <rect x="0" y="0" width="600" height="320" fill="#b8dff0"/>
  <!-- 路面 -->
  <rect x="0" y="320" width="600" height="100" fill="#888"/>
  <rect x="0" y="320" width="600" height="6" fill="#999"/>

  <!-- 后轮 -->
  <circle cx="200" cy="310" r="70" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="200" cy="310" r="4" fill="#555"/>
  <line x1="200" y1="310" x2="260" y2="290" stroke="#666" stroke-width="2"/>
  <line x1="200" y1="310" x2="220" y2="245" stroke="#666" stroke-width="2"/>
  <line x1="200" y1="310" x2="145" y2="270" stroke="#666" stroke-width="2"/>

  <!-- 前轮 -->
  <circle cx="400" cy="310" r="70" fill="none" stroke="#333" stroke-width="6"/>
  <circle cx="400" cy="310" r="4" fill="#555"/>
  <line x1="400" y1="310" x2="455" y2="280" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="310" x2="420" y2="245" stroke="#666" stroke-width="2"/>
  <line x1="400" y1="310" x2="350" y2="265" stroke="#666" stroke-width="2"/>

  <!-- 车架 -->
  <line x1="200" y1="310" x2="300" y2="230" stroke="#d44" stroke-width="5"/>
  <line x1="400" y1="310" x2="300" y2="230" stroke="#d44" stroke-width="5"/>
  <line x1="300" y1="230" x2="300" y2="200" stroke="#d44" stroke-width="5"/>
  <line x1="230" y1="310" x2="300" y2="230" stroke="#d44" stroke-width="5"/>

  <!-- 车把 -->
  <line x1="300" y1="200" x2="330" y2="185" stroke="#d44" stroke-width="4"/>

  <!-- 踏板连杆 -->
  <circle cx="230" cy="310" r="8" fill="#555"/>
  <circle cx="370" cy="310" r="8" fill="#555"/>

  <!-- 鹈鹕身体 -->
  <ellipse cx="295" cy="175" rx="38" ry="30" fill="#fff" stroke="#ddd" stroke-width="1"/>

  <!-- 脖子 -->
  <path d="M310,160 Q330,130 325,105" fill="none" stroke="#fff" stroke-width="14"/>

  <!-- 头部 -->
  <circle cx="325" cy="98" r="16" fill="#fff" stroke="#ddd" stroke-width="1"/>

  <!-- 眼睛 -->
  <circle cx="330" cy="93" r="4" fill="#333"/>
  <circle cx="331" cy="92" r="1.5" fill="#fff"/>

  <!-- 长喙上颚 -->
  <line x1="340" y1="100" x2="390" y2="108" stroke="#f90" stroke-width="5" stroke-linecap="round"/>

  <!-- 喉囊 -->
  <path d="M340,102 Q360,125 388,110" fill="none" stroke="#f90" stroke-width="3"/>
  <path d="M340,102 Q365,130 388,110" fill="#fa0" opacity="0.5"/>

  <!-- 翅膀 -->
  <ellipse cx="280" cy="168" rx="10" ry="22" fill="#eee" stroke="#ddd" stroke-width="1" transform="rotate(-15 280 168)"/>

  <!-- 腿1: 踩踏板 -->
  <line x1="285" y1="200" x2="260" y2="250" stroke="#f90" stroke-width="4"/>
  <line x1="260" y1="250" x2="240" y2="310" stroke="#f90" stroke-width="4"/>
  <!-- 脚 -->
  <line x1="240" y1="310" x2="225" y2="315" stroke="#f90" stroke-width="3"/>
  <line x1="240" y1="310" x2="235" y2="318" stroke="#f90" stroke-width="3"/>
  <line x1="240" y1="310" x2="248" y2="316" stroke="#f90" stroke-width="3"/>

  <!-- 腿2 -->
  <line x1="298" y1="198" x2="310" y2="248" stroke="#f90" stroke-width="4"/>
  <line x1="310" y1="248" x2="360" y2="308" stroke="#f90" stroke-width="4"/>
  <line x1="360" y1="308" x2="348" y2="314" stroke="#f90" stroke-width="3"/>
  <line x1="360" y1="308" x2="358" y2="317" stroke="#f90" stroke-width="3"/>
  <line x1="360" y1="308" x2="367" y2="316" stroke="#f90" stroke-width="3"/>

  <!-- 尾巴 -->
  <path d="M258,175 Q240,165 245,155" fill="none" stroke="#eee" stroke-width="5" stroke-linecap="round"/>
</svg>
</body>
</html>
