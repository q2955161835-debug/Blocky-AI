[package]
name = "blocky-studio"
version = "0.5.0"
edition = "2024"
default-run = "blocky-studio"

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
dirs = "=6.0.0"
rfd = { version = "=0.17.2", default-features = false }
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
uuid = { version = "=1.26.1", features = ["v4"] }
sha2 = "=0.10.9"
regex = "=1.13.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
tokio = { version = "=1.53.1", features = ["rt", "time", "macros"] }
fastembed = { version = "=5.17.4", default-features = false, features = ["ort-download-binaries-rustls-tls"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
tauri-plugin-single-instance = "=2.4.4"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
uiautomation = { version = "=0.25.1", features = ["event"] }
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }

[profile.release]
strip = true

[dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_ApplicationInstallationAndServicing", "Win32_System_LibraryLoader", "Win32_UI_Controls"] }

[patch.crates-io]
wry = { path = "../../vendor/wry" }
