[package]
name = "blocky-studio"
version = "0.1.0"
edition = "2024"
default-run = "blocky-studio"

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
rfd = { version = "=0.17.2", default-features = false }
zip = { version = "=6.0.0", default-features = false, features = ["deflate"] }
uuid = { version = "=1.26.1", features = ["v4"] }
sha2 = "=0.10.9"
regex = "=1.13.1"
tauri-plugin-single-instance = "=2.4.4"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem"] }
tauri-plugin-wdio = { version = "=1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.3.0", optional = true }

[profile.release]
strip = true

[patch.crates-io]
wry = { path = "../../vendor/wry" }
