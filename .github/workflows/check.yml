name: Formal workspace
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Contract and Host tests consume the generated, pinned runtime assets.
      - run: pnpm build:cli
      - run: pnpm check
      - run: pnpm test:component
      - run: pnpm test:host
      - run: pnpm test:cli
