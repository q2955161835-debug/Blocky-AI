name: Formal workspace
on:
  workflow_dispatch:
    inputs:
      knowledge_quality:
        description: Run the frozen C quality corpus with the actual Windows Host and pinned E5 model
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Contract and Host tests consume the generated, pinned runtime assets.
      - run: pnpm build:cli
      - run: pnpm check
      - run: pnpm test:component
      - run: pnpm test:host
      - run: pnpm test:cli
      - name: Frozen knowledge quality (actual Host/model)
        if: github.event_name == 'workflow_dispatch' && inputs.knowledge_quality
        run: pnpm evaluate:knowledge:capability
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            try/agent-capability-upgrade/quality-*/report.json
