[package]
name = "blocky-windows-core-spike"
version = "0.0.0"
description = "Blocky visual AI productivity workbench"
edition = "2024"

[lib]
name = "blocky_windows_core_spike_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
dotenvy = "0.15.7"
regex = "1.13.1"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rfd = { version = "0.17.2", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-wdio = { version = "1.3.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "sync"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
